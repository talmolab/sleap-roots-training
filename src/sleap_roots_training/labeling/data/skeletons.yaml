# Per-crop labeling skeletons: what a labeler must label with so a new package matches
# the existing corpus.
#
# Sources:
#   - Every `mode: cylinder` row: the `/build-labeling-package` command doc's skeleton
#     table (`build-labeling-package.md:45-51`), Box snapshot 2026-07-29 of
#     `Phenotyping_team_GH/sleap-roots-training/onboarding/`. Upstream is the vault at
#     `c:\vaults\sleap-roots\labeling-packages\`, whose history does not survive the copy.
#     That doc builds packages "from a finished cylinder experiment", so its rows are
#     taken as cylinder rows.
#   - The `mode: plate` row: the committed label inventory, `inventory/label-inventory.csv`
#     (#58). See the row's own comment.
#
# ---------------------------------------------------------------------------------------
# THIS TABLE IS ADVISORY AND PARTLY UNVERIFIED. Its own source says so: "Query the Bloom
# database or check existing test data ... to confirm node counts for the crop."
#
#   - soybean primary (6) and lateral (4) are VERIFIED (2026-08-04) against the real WEEP
#     artifacts that became the published collection: `soybean_weep_*_labels.v000.slp` and
#     the repaired `labels_weep_*.v001.pkg.slp` all carry `soybean_primary` r1-r6 and
#     `soybean_lateral` r1-r4.
#   - canola, arabidopsis (cylinder), and rice are TRANSCRIBED, NOT VERIFIED. Canola's
#     lateral count (3) is the one asymmetry in the table — soybean and arabidopsis are both
#     4 — and nothing here confirms it.
#   - arabidopsis plate primary (8) is VERIFIED (2026-09-24) against the published
#     collection `plate_arabidopsis_2-7DAG_primary_8nodes_labels`, downloaded and read by
#     hand: `Skeleton-1`, r1-r8, 3,032 user instances. See the row.
#   - pennycress has NO ROW ON PURPOSE. The source table omits it, although pennycress is
#     in SPECIES_VOCAB and has two `model_selection.yaml` rows. The loader fails loudly on
#     a missing pair rather than defaulting: a wrong node count produces a labeling package
#     that looks fine and cannot be combined with anything.
#
# Each row now carries `verified:` so this distinction is machine-readable rather than only
# prose here. `lookup_skeleton` warns when a package is built against an unverified count,
# and the package records this table's SHA256 — so when a row is corrected, packages built
# before and after are distinguishable rather than silently different.
#
# The verification test against the eight published collections in
# `wandb-registry-sleap-roots-labels` is meant to flip the remaining rows to
# `verified: true`, but it cannot yet resolve any collection: every published skeleton is
# named `Skeleton-N` (#64). Until it can, a row is flipped only on a hand read, as the
# soybean and arabidopsis plate rows were.
# ---------------------------------------------------------------------------------------
#
# THESE ARE **NATIVE** SKELETONS, NOT THE UNIFIED ONE. This table is *descriptive*: what a
# labeler must label with so a new package extends the corpus that already exists.
# `docs/roadmap.md` ("Open roadmap decisions") sets "the common skeleton / node count per
# root type for unification" as an open question at Tier 2.7 — a *prescriptive* choice, to
# be validated by a node-count sweep and not yet made. Folding this table into that
# decision would make new labeling packages silently stop matching the corpus they exist to
# extend.
#
# `mode` is required and is one of `sleap_roots_contracts.Mode` (via `chooser.MODE_VOCAB`).
# There is no default: a default would pick a mode, and `lookup_skeleton` raises instead
# when a species and root type have rows in more than one mode and no mode is given. There
# are no `multiplant cylinder` rows yet, so such a package fails loudly (#62).
#
# `age` is the native chooser comma-list (DAG), matching
# `registry/data/model_selection.yaml`; `null` means the row applies at every age. Rice
# splits by age, cross-checked against `model_selection.yaml` by a test; arabidopsis plate
# primary splits at the window its evidence covers.
#
# Node names are always `r1`, `r2`, ... `rN` — r1 is the base, the last node is the tip,
# evenly spaced along the root (`build-labeling-package.md:53`). The convention is fixed,
# so a row states only its count and the loader derives the names and the edge chain.

skeletons:
  - species: soybean
    root_type: primary
    mode: cylinder
    age: null
    node_count: 6
    verified: true

  - species: soybean
    root_type: lateral
    mode: cylinder
    age: null
    node_count: 4
    verified: true

  - species: canola
    root_type: primary
    mode: cylinder
    age: null
    node_count: 6
    verified: false

  # UNVERIFIED, and the table's one asymmetry: soybean and arabidopsis laterals are 4.
  - species: canola
    root_type: lateral
    mode: cylinder
    age: null
    node_count: 3
    verified: false

  - species: arabidopsis
    root_type: primary
    mode: cylinder
    age: null
    node_count: 6
    verified: false

  - species: arabidopsis
    root_type: lateral
    mode: cylinder
    age: null
    node_count: 4
    verified: false

  # Rice young (2-5 DAG): primary + crown. Matches the `model_selection.yaml` rice row
  # with age "2, 3, 4, 5" (primary + crown models, no lateral).
  - species: rice
    root_type: primary
    mode: cylinder
    age: "2, 3, 4, 5"
    node_count: 6
    verified: false

  - species: rice
    root_type: crown
    mode: cylinder
    age: "2, 3, 4, 5"
    node_count: 6
    verified: false

  # Rice old (6-10 DAG): crown only. Matches the `model_selection.yaml` rice row with age
  # "6, 7, 8, 9, 10" (crown model only).
  - species: rice
    root_type: crown
    mode: cylinder
    age: "6, 7, 8, 9, 10"
    node_count: 6
    verified: false

  # Arabidopsis PLATE primary (add-skeleton-mode). 8 nodes is the strict plurality among
  # labelled arabidopsis/plate/primary families in `inventory/label-inventory.csv`,
  # enforced by `test_the_plate_row_agrees_with_the_committed_scan` (9 of those 13
  # families are one lineage and its copies, so this is not 13 independent labelings).
  # VERIFIED (eberrigan, 2026-09-24) on a hand read of the published
  # `plate_arabidopsis_2-7DAG_primary_8nodes_labels`: 8 nodes r1-r8, 3,032 user instances,
  # agreeing with the row. The automated check cannot resolve it (#64); its mode here is
  # the collection name's `plate`, and the scan's is read off directory names.
  #
  # Ages are DAG. The plate files say "DAP"; the team uses DAP and DAG for the same thing
  # and calls it DAG throughout (eberrigan, 2026-09-24), so 2-7 DAP is this row's 2-7 DAG.
  #
  # The families that disagree with this row's 8 nodes, identified by eberrigan from
  # their images (2026-09-24):
  #   - 6-node families are WHEAT, not arabidopsis: four `labels_wheat_2-3DAG*` and
  #     `day2and3 copy.slp`. Their images are in `SLEAP_arabidopsis_plates/
  #     suyash_wheat_day_2and3/` — wheat plate data placed beside arabidopsis, likely to
  #     train one model for arabidopsis inference. They are not evidence for this row. The
  #     inventory still calls them arabidopsis, because it reads species from the
  #     directory before the filename (#65).
  #   - 7-node families are ARABIDOPSIS: `labels.v00{2,4,5}*` under `7_dap/labels/` (and
  #     its copy under `primary_root_8nodes/`), 24 images of one 2023-01-20 session in
  #     `7_dap/GDSL_Sow_Day_7_Processed/`. OPEN, for a person to settle: 7 nodes against
  #     this row's 8. The gap report lists them as disagreeing.
  # Shares the skeleton name `arabidopsis_primary` with the 6-node cylinder row
  # (`to_skeleton()` names by species and root type); the two are told apart by node
  # count and by `package_metadata.yaml`'s `mode`.
  - species: arabidopsis
    root_type: primary
    mode: plate
    age: "2, 3, 4, 5, 6, 7"
    node_count: 8
    verified: true

  # pennycress: intentionally absent — see the header.
