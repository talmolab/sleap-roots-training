# Production model selection matrix for the sleap-roots pipeline: 9 rows over 11
# physical models.
#
# Each row selects models for one (species, mode, age window). Rows come from more than
# one place, so provenance is recorded per row and per model rather than claimed once
# for the whole file (talmolab/sleap-roots-training#72):
#
#   - `source` on every row says why the row exists with its window: transcribed from the
#     models-downloader chooser table, or an owner decision with its issue.
#   - `origins` (keyed by model id, like `checksums`) says where each `<model_id>.zip`
#     came from (`snapshot`, `location`) and what pinned that exact file (`pinned_by`).
#     `location` is relative to a run or a snapshot, never a share path: this repo is
#     public. `snapshot: null` means the zip ships in no models-downloader snapshot.
#
# The models-downloader rows were transcribed from `model_chooser_table.xlsx` in the
# 20250204 snapshot of https://gitlab.com/salk-tm/models-downloader
# (tests/data/models_downloader_input/20250204_models/model_chooser_table.xlsx).
#
# `age` is the native chooser comma-list; chooser.py parses it to age_min/age_max
# (a contiguous window). Absent root-type slots are `null`.
#
# `checksums` pins each source `<model_id>.zip` by SHA256, so the published
# `weights_checksum` (the whole-artifact digest) is deterministic. Regenerate with
# scripts/regen_model_checksums.py against a root holding every `<model_id>.zip`.
#
# The arabidopsis `plate` row (arabidopsis_plates/primary + /lateral) is OMITTED:
# those models are absent from the snapshot and have no concrete `.n=` id.
# Tracked by talmolab/sleap-roots-training#3.

