[project]
name = "sleap-roots-training"
version = "0.0.1a0"
description = "Config-driven training and evaluation of SLEAP root models on the sleap-nn backend."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "eberrigan", email = "eberrigan@salk.edu" }
]
requires-python = ">=3.11"
keywords = [
    "sleap",
    "roots",
    "phenotyping",
    "plant-science",
    "pose-estimation",
    "model-training",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "click>=8.0.0",
    "omegaconf>=2.3.0",
    # pandas is DIRECT, not transitive (task 2.1). The ported selection code imports it
    # itself; it happened to be importable already only because sleap-io depends on it,
    # and relying on that would break silently the day sleap-io drops it.
    # The range is wide on purpose: the API used here is read_csv/groupby/to_csv, and
    # task 2.7 removed the one version-sensitive behavior — selection no longer goes
    # through pandas' RNG, so `.sample()`'s draw semantics can no longer move the frames
    # a package labels. uv.lock pins the version CI actually exercises.
    "pandas>=2.2.0,<4.0.0",
    # sleap-io is a CORE dependency, not an extra (design.md Decision 4): building labeling
    # packages is first-class CLI functionality, so a default install must not have a
    # subcommand that fails on import. Extras are for heavy/platform-specific backends
    # (sleap-nn, torch), not for merely-new dependencies.
    # The <0.8.0 cap deliberately matches the `train` extra's pre-mask line so the two cannot
    # disagree; sleap-io is declared in BOTH places on purpose — see the `train` comment.
    "sleap-io>=0.7.1,<0.8.0",
    "sleap-roots-contracts==0.1.0a6",
    "wandb>=0.28.0,<0.29.0",
]

[project.optional-dependencies]
# Phase-1 sleap-nn keypoint training backend (Tier 0.5, #9). Heavy + platform-specific,
# so kept out of the base install; CI never selects this extra.
# The sleap-nn/sleap-io caps are DELIBERATE: v0.3.0 / sleap-io 0.8.0 (the mask line) have
# shipped, but are not yet verified here, so Phase 1 stays on the pre-mask line — raise the
# caps at the Tier 6 mask re-verify.
# torch is floor-only (no upper cap) ON PURPOSE: it mirrors upstream sleap-nn's own unpinned
# torch, and the real CUDA build is chosen at install time on the GPU box
# (uv pip install ".[train]" --torch-backend=auto|cu124|cu126), not from uv.lock.
# sleap-io stays listed here even though it is now also a core dependency: this cap is bound
# to sleap-nn's compatibility, the core one to what the labeling builder needs. uv intersects
# them, so the backend stays on the verified pre-mask line even if the core pin is widened
# first. Raising one without the other is the bug this duplication is here to catch.
# See docs/training-backend.md.
train = [
    "sleap-nn>=0.2.0,<0.3.0",
    "sleap-io>=0.7.1,<0.8.0",
    "torch>=2.5.0",  # floor-only by design — see comment above
]

[project.urls]
Homepage = "https://github.com/talmolab/sleap-roots-training"
Repository = "https://github.com/talmolab/sleap-roots-training"
Issues = "https://github.com/talmolab/sleap-roots-training/issues"
Changelog = "https://github.com/talmolab/sleap-roots-training/blob/main/docs/CHANGELOG.md"

[project.scripts]
sleap-roots-training = "sleap_roots_training.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.3.0",
    "packaging>=24.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.11",
]

[tool.black]
line-length = 88
# Match `requires-python`. Without it black infers the newest grammar it knows and then
# warns that its AST-equivalence safety check is degraded on the interpreter running it.
target-version = ["py311"]

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (slow, run real training/inference)",
]
