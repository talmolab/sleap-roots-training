# Tier 1 sigma ABLATION — Arabidopsis primary root, multi-plant cylinder (bottom-up), output_stride 2, sigma 5.0.
#
# This is the control that settled why the os2 (`output_stride 2`) config collapsed (issue #21): it
# is byte-identical to examples/baseline_bottomup_v000_os2.yaml EXCEPT `confmaps.sigma` 2.5 -> 5.0
# (5.0 is sleap-nn's default). Run across seeds 42/43/44 it trains stably on every seed and detects
# ~all instances (val `dist_avg` 31.7-36.5 px, `vis_recall` 0.80-0.88), whereas the sigma-2.5 os2
# config collapsed to zero predictions on 2 of 3 seeds. So the collapse was too-tight confmap targets
# at the finer output stride, NOT a resolution ceiling and NOT fundamentally the loss.
#
# It is NOT the reported baseline: it does not beat the stable os4 config
# (examples/baseline_bottomup_v000_os4.yaml) — the higher output resolution buys no localization gain,
# consistent with the error being detection/model-quality bound. See docs/training.md ("PyTorch baseline").
#
#   sleap-roots-training validate examples/baseline_bottomup_v000_os2_sigma5.yaml
#   sleap-roots-training emit     examples/baseline_bottomup_v000_os2_sigma5.yaml -o resolved.yaml
#   sleap-nn train --config resolved.yaml      # needs the [train] extra (GPU box only)

experiment:
  species: arabidopsis          # SPECIES_VOCAB (registry/chooser.py)
  mode: multiplant cylinder     # MODE_VOCAB — multi-plant (1–3 root instances per frame), bottom-up
  root_type: primary            # primary | lateral | crown
  dataset:
    name: cyl_arabidopsis_primary_6nodes_v000
    path: data/v000_train.pkg.slp   # cleaned v000 split (scripts/clean_pkg.py)

data_config:
  train_labels_path:
    - data/v000_train.pkg.slp
  val_labels_path:
    - data/v000_val.pkg.slp
  preprocessing:
    ensure_rgb: false
    ensure_grayscale: false
    max_height: 1088
    max_width: 2048
    scale: 0.5
    crop_size: null
    min_crop_size: 100
    crop_padding: null

model_config:
  backbone_config:
    unet:
      filters: 16
      filters_rate: 2.0
      max_stride: 32
      output_stride: 2
      up_interpolate: true
  head_configs:
    bottomup:
      confmaps:
        part_names: [r1, r2, r3, r4, r5, r6]
        sigma: 5.0                # the ablated knob (os2 baseline uses 2.5, which collapses)
        output_stride: 2
      pafs:
        edges: [[r1, r2], [r2, r3], [r3, r4], [r4, r5], [r5, r6]]
        sigma: 75.0
        output_stride: 8

trainer_config:
  max_epochs: 200
  min_train_steps_per_epoch: 25
  # sleap-nn 0.2.0 trainer defaults the reported runs used, pinned explicitly (see docs/training.md).
  train_data_loader:
    batch_size: 4
  optimizer_name: Adam
  optimizer:
    lr: 0.0001
    amsgrad: false
  lr_scheduler:
    reduce_lr_on_plateau:
      threshold: 1.0e-06
      threshold_mode: abs
      cooldown: 3
      patience: 5
      factor: 0.5
      min_lr: 1.0e-08
  early_stopping:
    stop_training_on_plateau: true
    min_delta: 1.0e-08
    patience: 10
  seed: 42                        # vary 42 / 43 / 44 across the 3 runs
  save_ckpt: true
  ckpt_dir: models
  run_name: baseline_bottomup_v000_os2_sigma5_seed42
  online_hard_keypoint_mining:
    online_mining: true
  use_wandb: true
  wandb:
    entity: eberrigan-salk-institute-for-biological-studies
    project: sleap-roots-tier1-baseline
