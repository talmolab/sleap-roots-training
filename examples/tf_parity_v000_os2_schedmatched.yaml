# Tier 1 — SCHEDULE-MATCHED TF-parity control (issue #36 / sleap-nn#718).
#
# Purpose: decide whether the output_stride 2 / sigma 2.5 collapse in sleap-nn is caused by the
# unweighted per-pixel confmap loss (sleap-nn#718) or by a training-SCHEDULE mismatch (far fewer
# gradient steps + shorter early-stopping patience than the TF reference). The earlier TF-parity
# control matched TF on architecture/resolution/sigma but kept sleap-nn's SHORT schedule, so it could
# not separate the two. This config matches the legacy TF reference
# (tests/fixtures/tf_reference/nxe8xgsd.config.json) on architecture, resolution, sigma, AND schedule,
# so the only remaining difference from the successful TF run is the backend training dynamics / loss.
#   - collapse with everything matched  -> supports the loss / training-dynamics theory (sleap-nn#718)
#   - stable training                   -> falsifies it; the earlier collapse was a step-count effect
#
# Matched to TF: scale 1.0 (full res), max_stride 16, filters 24 / filters_rate 1.5, output_stride 2,
# confmaps.sigma 2.5, pafs.sigma 75, online_mining false, Adam 1e-4, and min_train_steps_per_epoch 200
# (TF's ~8x oversampling; with patience 10 that is ~2000 gradient steps of early-stop patience, vs the
# earlier control's ~250). Augmentation off (TF used flip-only; sleap-nn has no flip op). batch_size 2
# is memory-forced at full resolution; the matched variable is gradient STEPS per epoch (200), not
# samples per epoch.
#
#   sleap-roots-training validate examples/tf_parity_v000_os2_schedmatched.yaml
#   sleap-roots-training emit     examples/tf_parity_v000_os2_schedmatched.yaml -o resolved.yaml
#   sleap-nn train --config resolved.yaml      # needs the [train] extra (GPU box only)

experiment:
  species: arabidopsis
  mode: multiplant cylinder
  root_type: primary
  dataset:
    name: cyl_arabidopsis_primary_6nodes_v000
    path: data/v000_train.pkg.slp

data_config:
  train_labels_path:
    - data/v000_train.pkg.slp
  val_labels_path:
    - data/v000_val.pkg.slp
  use_augmentations_train: false   # TF used flip-only; sleap-nn has no flip op, so closest is off
  preprocessing:
    ensure_rgb: false
    ensure_grayscale: false
    max_height: 1088
    max_width: 2048
    scale: 1.0                     # full resolution, matching TF (the earlier baseline uses 0.5)
    crop_size: null
    min_crop_size: 100
    crop_padding: null

model_config:
  backbone_config:
    unet:
      filters: 24                  # TF value (the reported baseline uses 16)
      filters_rate: 1.5            # TF value (the reported baseline uses 2.0)
      max_stride: 16               # TF value (the reported baseline uses 32)
      output_stride: 2             # TF value (the reported baseline uses 4)
      up_interpolate: true
  head_configs:
    bottomup:
      confmaps:
        part_names: [r1, r2, r3, r4, r5, r6]
        sigma: 2.5
        output_stride: 2
      pafs:
        edges: [[r1, r2], [r2, r3], [r3, r4], [r4, r5], [r5, r6]]
        sigma: 75.0
        output_stride: 8

trainer_config:
  max_epochs: 200
  min_train_steps_per_epoch: 200   # SCHEDULE MATCH: TF's ~8x oversampling (the confound under test)
  train_data_loader:
    batch_size: 2                  # memory-forced at full resolution
  optimizer_name: Adam
  optimizer:
    lr: 0.0001
    amsgrad: false
  lr_scheduler:
    reduce_lr_on_plateau:
      threshold: 1.0e-06
      threshold_mode: abs
      cooldown: 3
      patience: 5
      factor: 0.5
      min_lr: 1.0e-08
  early_stopping:
    stop_training_on_plateau: true
    min_delta: 1.0e-06
    patience: 10                   # with 200 steps/epoch = ~2000-step patience, matching TF
  seed: 42                         # vary 42 / 43 / 44 across the 3 runs
  save_ckpt: true
  ckpt_dir: models
  run_name: tf_parity_v000_os2_schedmatched_seed42
  online_hard_keypoint_mining:
    online_mining: false           # TF value (the reported baseline uses true)
  use_wandb: true
  wandb:
    entity: eberrigan-salk-institute-for-biological-studies
    project: sleap-roots-tier1-baseline
