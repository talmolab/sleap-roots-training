# Tier 1 PyTorch baseline — Arabidopsis primary root, multi-plant cylinder (bottom-up), output_stride 2.
#
# One of TWO configs in the Tier 1 baseline comparison (issue #21): this `output_stride 2` variant
# and its `output_stride 4` sibling (examples/baseline_bottomup_v000_os4.yaml). Each is run across
# seeds 42 / 43 / 44 (vary only `trainer_config.seed` + the `run_name` suffix) on the exact v000
# held-out split, evaluated on val.pkg.slp. On v000 val, os2 gives marginally better median
# localization but detects far fewer instances than os4 (recall ~0.58 vs ~0.91) — see docs/training.md.
#
#   sleap-roots-training validate examples/baseline_bottomup_v000_os2.yaml
#   sleap-roots-training emit     examples/baseline_bottomup_v000_os2.yaml -o resolved.yaml
#   sleap-nn train --config resolved.yaml      # needs the [train] extra (GPU box only)
#
# WHY THIS LOOKS NOTHING LIKE THE LEGACY TF CONFIG (do NOT "fix" it back toward TF values):
# sleap-nn 0.2.0's bottom-up loss is a plain per-pixel MSELoss with no foreground weighting. On a
# 1088x2048 image the keypoint confmap targets are ~0.004% foreground, so a full-resolution run
# collapses to ~0 predictions → NaN metrics. The escape is to DENSIFY the targets: downscale the
# input (`scale: 0.5`), a coarse `output_stride` with a deep backbone (`max_stride: 32`), and online
# hard-keypoint mining. Accuracy is therefore resolution-limited and lands above the legacy TF
# ~1–1.7 px; that gap is an expected, documented finding, not a gate (docs/roadmap.md oracle philosophy).

experiment:
  species: arabidopsis          # SPECIES_VOCAB (registry/chooser.py)
  mode: multiplant cylinder     # MODE_VOCAB — multi-plant (1–3 root instances per frame), bottom-up
  root_type: primary            # primary | lateral | crown
  dataset:
    name: cyl_arabidopsis_primary_6nodes_v000
    path: data/v000_train.pkg.slp   # cleaned v000 split (scripts/clean_pkg.py)

data_config:
  train_labels_path:
    - data/v000_train.pkg.slp
  val_labels_path:
    - data/v000_val.pkg.slp
  preprocessing:
    ensure_rgb: false
    ensure_grayscale: false
    # sizematcher letterboxes the ORIGINAL to max_height x max_width FIRST (pad-only), THEN `scale`
    # resizes → the net receives a clean 544x1024 tensor. Do NOT set max_height/width to 544/1024.
    max_height: 1088
    max_width: 2048
    scale: 0.5
    crop_size: null
    min_crop_size: 100
    crop_padding: null

model_config:
  backbone_config:
    unet:
      filters: 16
      filters_rate: 2.0
      max_stride: 32
      output_stride: 2
      up_interpolate: true
  head_configs:
    bottomup:
      confmaps:
        part_names: [r1, r2, r3, r4, r5, r6]
        sigma: 2.5
        output_stride: 2
      pafs:
        edges: [[r1, r2], [r2, r3], [r3, r4], [r4, r5], [r5, r6]]
        sigma: 75.0
        output_stride: 8

trainer_config:
  max_epochs: 200               # early-stops well before this
  min_train_steps_per_epoch: 25
  seed: 42                      # vary 42 / 43 / 44 across the 3 runs
  save_ckpt: true
  ckpt_dir: models
  run_name: baseline_bottomup_v000_os2_seed42   # bump the seed suffix per run
  online_hard_keypoint_mining:
    online_mining: true
  use_wandb: true
  wandb:
    entity: eberrigan-salk-institute-for-biological-studies
    project: sleap-roots-tier1-baseline
