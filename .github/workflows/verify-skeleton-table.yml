# Verifies the committed labeling skeleton table against the published label collections.
#
# design.md Decision 7 calls this check "what converts the table from hypothesis to
# record". It was written, marked `integration`, and gated behind
# SLEAP_ROOTS_LABEL_SKELETON_CHECK — and nothing ever set that variable, so it never ran
# and the risk it was meant to close stayed open (blocking review of #40). This is the
# thing that sets it.
#
# Weekly rather than per-PR because it downloads 170 MB - 1.2 GB per collection, eight
# times; the table changes rarely and the collections change rarely, so a PR-time run
# would be almost entirely wasted transfer. It also runs on demand, and on any push that
# touches the table or its loader — which is exactly when the answer can change.
#
# Requires a WANDB_API_KEY repository secret. Without one the job reports a clear skip
# rather than a red X, so an unconfigured fork does not look broken.
name: Verify skeleton table

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/sleap_roots_training/labeling/data/skeletons.yaml"
      - "src/sleap_roots_training/labeling/skeletons.py"
      - "tests/test_labeling_skeletons.py"
      - ".github/workflows/verify-skeleton-table.yml"

jobs:
  verify:
    name: Skeleton table vs published collections
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Check for W&B credentials
        id: creds
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          if [ -z "$WANDB_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No WANDB_API_KEY secret is configured, so the skeleton table" \
                 "cannot be checked against the published collections. Add the secret to" \
                 "enable this job."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the table against wandb-registry-sleap-roots-labels
        if: steps.creds.outputs.present == 'true'
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          SLEAP_ROOTS_LABEL_SKELETON_CHECK: "1"
        run: |
          uv run pytest -m integration -v \
            tests/test_labeling_skeletons.py \
            -k test_the_table_agrees_with_the_published_label_collections
